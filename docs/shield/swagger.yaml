  /integrations/logs-data/upload/complete:
    post:
      consumes:
      - application/json
      description: |-
        Confirms a direct S3 upload by verifying the file exists in S3 and storing the log file record.

        ## Flow
        Call this endpoint after receiving HTTP 204 from the S3 POST upload.

        ## Rules
        - `key` must match exactly what was returned by `/upload/presign`
        - `etag` must match the `ETag` response header from the S3 POST — include surrounding quotes e.g. `"abc123"`
        - The file must exist in S3 at the given key or the request will fail with 404
        - `metadata.source_type` is required — describes the log source e.g. `firewall`, `nginx`, `windows_security`
        - The upload can only be confirmed once — subsequent calls with the same key will fail
        - `source_id` is optional — links the log file to an existing data source in the system
      parameters:
      - description: Upload complete request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UploadCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Confirmed log file record
          schema:
            $ref: '#/definitions/http.ConfirmUploadResponse'
        "400":
          description: Invalid request body or ETag mismatch
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: File not found in S3
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Upload already confirmed
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - SessionAuth: []
      summary: Complete Upload
      tags:
      - Logs & Data
  /integrations/logs-data/upload/presign:
    post:
      consumes:
      - application/json
      description: |-
        Initiates a direct-to-S3 upload flow by generating a presigned POST URL.

        ## Flow
        1. Call this endpoint with the file metadata (name, size, content type)
        2. Use the returned `post.url` and `post.fields` to upload the file directly to S3 as `multipart/form-data`
        3. The `file` field must be the **last** field in the multipart body
        4. On S3 success (HTTP 204), call `/upload/complete` with the `key` and `ETag` from the S3 response headers

        ## Rules
        - Supported extensions: `.json`, `.csv`, `.xml`, `.gz`, `.zip`, `.tar`, `.pcap`, `.log`, `.evt`, `.evtx`, `.txt`, `.yml`, `.yaml`
        - Maximum file size is enforced via the `content-length-range` condition in the policy
        - The presign URL expires in 24 hours — complete the upload before expiry
        - The returned `key` must be passed exactly as-is to the complete endpoint
        - Do not modify or add extra fields to the S3 POST — the policy will reject the request with HTTP 403
      parameters:
      - description: File metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UploadLogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presign response containing S3 POST URL, fields, key and expiry
          schema:
            $ref: '#/definitions/http.UploadPresignResponse'
        "400":
          description: Invalid request body or unsupported file type
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "413":
          description: File size exceeds maximum allowed
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - SessionAuth: []
      summary: Create Upload Presign
      tags:
      - Logs & Data
