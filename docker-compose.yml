name: sage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sage-net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sage-net]

  # One-shot: runs `migrations/main.go --up` then exits. Everything else
  # waits on it via `condition: service_completed_successfully`.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./migrations
    command: ["--up"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sage-net]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  shield:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/shield
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379
      SHIELD_PORT: 3335
    ports:
      - "3335:3335"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  # Placeholder service — no HTTP endpoints yet per README, but wired up
  # so the container builds/starts cleanly as the module fills in.
  offensive:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/offensive
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379
      OFFENSE_PORT: 3334
    ports:
      - "3334:3334"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  # Placeholder service — no HTTP endpoints yet per README, same as above.
  vision:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/vision
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379
      VISION_PORT: 3336
    ports:
      - "3336:3336"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/worker
    command: ["start", "--redis-addr", "redis:6379", "--concurrency", "10"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

volumes:
  pgdata:

networks:
  sage-net:
    driver: bridge