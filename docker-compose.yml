name: sage

services:
  postgres:
    image: postgres:16-alpine
    container_name: sage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sage_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sage_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sage-net]

  redis:
    image: redis:7-alpine
    container_name: sage-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sage-net]

  migrate:
    image: ${GHCR_IMAGE_PREFIX:-sage}/migrate:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./migrations
    command: ["--up", "--seed"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sage-net]
    restart: "no"

  api:
    image: ${GHCR_IMAGE_PREFIX:-sage}/api:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/api
    env_file: .env
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  shield:
    image: ${GHCR_IMAGE_PREFIX:-sage}/shield:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/shield
    env_file: .env
    environment:
      SHIELD_PORT: ${SHIELD_PORT:-3335}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "${SHIELD_PORT:-3335}:${SHIELD_PORT:-3335}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

  worker:
    image: ${GHCR_IMAGE_PREFIX:-sage}/worker:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_PATH: ./cmd/worker
    command: ["start", "--redis-addr", "redis:6379", "--concurrency", "10"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [sage-net]

volumes:
  pgdata:

networks:
  sage-net:
    driver: bridge
