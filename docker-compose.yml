
services:
  postgres:
    image: postgres:17
    container_name: sage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sage_user
      POSTGRES_PASSWORD: sage_dev_password
      POSTGRES_DB: sage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage_user -d sage_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  redis:
    image: docker.io/redis:7.2
    container_name: sage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-api
    restart: unless-stopped
    command: ["go", "run", "cmd/api/main.go"]
    ports:
      - "4000:4000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://sage_user:sage_dev_password@postgres:5432/sage_db?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_ENCRYPTION_KEY: dev-encryption-key-32-bytes-long
      REDIS_DB_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-key-32-bytes-long
      GOMNI_SECURITY_KEY: dev-security-key
      PORT: "4000"
      RESEND_API_KEY: test
      RESEND_FROM_EMAIL: test@example.com
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-worker
    restart: unless-stopped
    command: ["go", "run", "cmd/worker/main.go"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://sage_user:sage_dev_password@postgres:5432/sage_db?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_ENCRYPTION_KEY: dev-encryption-key-32-bytes-long
      REDIS_DB_URL: redis://redis:6379
      RESEND_API_KEY: test
      RESEND_FROM_EMAIL: test@example.com
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network

volumes:
  postgres_data:
  redis_data:

networks:
  sage-network:
    driver: bridge
