services:
  traefik:
    image: traefik:v2.11
    container_name: sage-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    environment:
      - DOCKER_API_VERSION=1.41
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sage-network

  postgres:
    image: postgres:17
    container_name: sage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sage_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sage_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sage_user} -d $${POSTGRES_DB:-sage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  redis:
    image: docker.io/redis:7.2
    container_name: sage-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-api
    restart: unless-stopped
    command: ["./api"]
    env_file:
      - .env
    environment:
      # Override DATABASE_URL and REDIS_DB_URL for internal docker networking
      DATABASE_URL: postgres://${POSTGRES_USER:-sage_user}:${POSTGRES_PASSWORD:-sage_dev_password}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
      REDIS_ADDR: redis:6379
      PORT: ${PORT:-3333}
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api/v1/user`) || PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/organization`) || PathPrefix(`/api/v1/profile`) || PathPrefix(`/docs/api-docs`) || PathPrefix(`/docs/api.json`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=${PORT:-3333}"
    networks:
      - sage-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-worker
    restart: unless-stopped
    command: ["./worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sage_user}:${POSTGRES_PASSWORD:-sage_dev_password}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network

  shield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-shield
    restart: unless-stopped
    command: ["./shield"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sage_user}:${POSTGRES_PASSWORD:-sage_dev_password}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB_URL: redis://redis:6379/0
      PORT: ${SHIELD_PORT:-3335}
    ports:
      - "${SHIELD_PORT:-3335}:${SHIELD_PORT:-3335}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shield.rule=PathPrefix(`/api/v1/logs-data`) || PathPrefix(`/api/v1/integrations`) || PathPrefix(`/api/v1/health`) || PathPrefix(`/docs/shield-docs`) || PathPrefix(`/docs/shield.json`)"
      - "traefik.http.routers.shield.entrypoints=web"
      - "traefik.http.services.shield.loadbalancer.server.port=${SHIELD_PORT:-3335}"
    networks:
      - sage-network

  offensive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-offensive
    restart: unless-stopped
    command: ["./offensive"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sage_user}:${POSTGRES_PASSWORD:-sage_dev_password}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB_URL: redis://redis:6379/0
    ports:
      - "${OFFENSE_PORT:-3334}:${OFFENSE_PORT:-3334}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network

  vision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sage-vision
    restart: unless-stopped
    command: ["./vision"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sage_user}:${POSTGRES_PASSWORD:-sage_dev_password}@postgres:5432/${POSTGRES_DB:-sage_db}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB_URL: redis://redis:6379/0
    ports:
      - "${VISION_PORT:-3336}:${VISION_PORT:-3336}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network

volumes:
  postgres_data:
  redis_data:

networks:
  sage-network:
    driver: bridge
