name: Build, Package & Deploy to Production

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peterpaul
          POSTGRES_PASSWORD: sage_dev_password
          POSTGRES_DB: sage_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Install Swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger Specs
        run: |
          swag init -g main.go -d ./cmd/api,./internal/identity,./internal/shared --parseInternal -o ./docs/users
          swag init -g main.go -d ./cmd/shield,./internal/shield,./internal/shared --parseInternal -o ./docs/shield

      - name: Execute Tests
        env:
          DATABASE_URL: "postgres://peterpaul:sage_dev_password@localhost:5432/sage_db_test?sslmode=disable"
          REDIS_DB_URL: "redis://localhost:6379/2"
        run: go test -v ./...

  build-and-push:
    name: Build & Push Images to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: BUILD_PATH=./cmd/api
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:latest
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}

      - name: Build & Push Shield Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: BUILD_PATH=./cmd/shield
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/shield:latest
            ghcr.io/${{ env.REPO_LOWER }}/shield:${{ github.sha }}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: BUILD_PATH=./cmd/worker
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/worker:latest
            ghcr.io/${{ env.REPO_LOWER }}/worker:${{ github.sha }}

      - name: Build & Push Migrate Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: BUILD_PATH=./migrations
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/migrate:latest
            ghcr.io/${{ env.REPO_LOWER }}/migrate:${{ github.sha }}

  deploy:
    name: Deploy to Production Portal via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Copy docker-compose.yml to Deployment Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/sage-be/"

      - name: Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/sage-be
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GHCR_IMAGE_PREFIX="ghcr.io/${{ env.REPO_LOWER }}"
            export TAG="latest"
            docker compose pull
            docker compose up -d --remove-orphans
            docker ps
