name: Build, Package & Deploy to Production

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peterpaul
          POSTGRES_PASSWORD: sage_dev_password
          POSTGRES_DB: sage_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peterpaul -d sage_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Execute Tests
        env:
          DATABASE_URL: "postgres://peterpaul:sage_dev_password@localhost:5432/sage_db_test?sslmode=disable"
          REDIS_DB_URL: "redis://localhost:6379/2"
        run: go test -p 1 -v ./...


  # ============================================================
  # BUILD & PUSH
  # ============================================================
  build-and-push:
    name: Build & Package Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ========================================================
      # API
      # ========================================================
      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BUILD_PATH=./cmd/api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:latest
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}

      # ========================================================
      # SHIELD
      # ========================================================
      - name: Build Shield Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BUILD_PATH=./cmd/shield
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/shield:latest
            ghcr.io/${{ env.REPO_LOWER }}/shield:${{ github.sha }}

      # ========================================================
      # WORKER
      # ========================================================
      - name: Build Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BUILD_PATH=./cmd/worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/worker:latest
            ghcr.io/${{ env.REPO_LOWER }}/worker:${{ github.sha }}

      # ========================================================
      # MIGRATION
      # ========================================================
      - name: Build Migration Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BUILD_PATH=./migrations
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/migrate:latest
            ghcr.io/${{ env.REPO_LOWER }}/migrate:${{ github.sha }}


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ========================================================
      # Copy Compose File
      # ========================================================
      - name: Copy docker-compose.yml to Deployment Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/sage-be/"

      # ========================================================
      # Deploy
      # ========================================================
      - name: Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/sage-be

            echo "========================================"
            echo "Logging into GitHub Container Registry"
            echo "========================================"

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            export GHCR_IMAGE_PREFIX="ghcr.io/${{ env.REPO_LOWER }}"
            export TAG="latest"

            echo ""
            echo "========================================"
            echo "Pulling latest images"
            echo "========================================"

            docker compose pull

            echo ""
            echo "========================================"
            echo "Stopping existing containers"
            echo "========================================"

            docker compose down --remove-orphans

            echo ""
            echo "========================================"
            echo "Running Database Migrations"
            echo "========================================"

            docker compose up migrate --force-recreate --remove-orphans

            echo ""
            echo "========================================"
            echo "Starting new containers"
            echo "========================================"

            docker compose up -d \
              --force-recreate \
              --remove-orphans

            echo ""
            echo "========================================"
            echo "Running Containers"
            echo "========================================"

            docker ps

            echo ""
            echo "========================================"
            echo "Deployed Images"
            echo "========================================"

            docker compose images

            echo ""
            echo "========================================"
            echo "Deployment Complete"
            echo "========================================"